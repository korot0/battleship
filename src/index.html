<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battleship</title>
  </head>
  <body>
    <h1 class="game-title">BATTLESHIP</h1>
    <p class="announcements">Place ships your ships...</p>
    <div class="board-layout">
      <section class="board board-player">
        <div class="board-grid"></div>
        <p>Your grid</p>
      </section>
      <!-- Fix positioning -->
      <div class="board-layout-divider">vs</div>
      <section class="board board-oponent">
        <div class="board-grid"></div>
        <p>Opponent's grid</p>
      </section>
      <section class="ship-selection hidden">
        <p class="ship-selection-description">
          Click a ship, and then place on grid:
        </p>
        <div class="ship-selection-container">
          <div class="carrier"></div>
          <div class="battleship"></div>
          <div class="cruiser"></div>
          <div class="submarine"></div>
          <div class="destroyer"></div>
        </div>
      </section>
    </div>
  </body>
</html>
